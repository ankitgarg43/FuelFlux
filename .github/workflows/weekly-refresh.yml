name: Weekly data refresh

on:
  schedule:
    # Wednesdays 16:30 UTC — EIA publishes Monday afternoon ET and NRCan
    # updates Tuesdays, so Wednesday always has both countries' new weeks
    # (with buffer for holiday-shifted releases).
    - cron: '30 16 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch the latest EIA + NRCan weekly data
        run: node scripts/refresh.mjs

      - name: Verify the app still passes on the new data
        run: npm test

      - name: Commit and push if the data changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes this week."
          else
            git commit -m "chore: weekly fuel data refresh (EIA + NRCan)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so
      # dispatch the Pages deploy explicitly.
      - name: Trigger the Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
