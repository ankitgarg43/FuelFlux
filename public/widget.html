<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>FuelFlux — Weekly Gas Prices</title>
<style>
  :root { color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #ffffff; color: #0f172a; padding: 14px 16px;
  }
  @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f1f5f9; } }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .city { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .week { font-size: 11px; color: #64748b; white-space: nowrap; }
  .price { display: flex; align-items: baseline; gap: 5px; margin-top: 6px; }
  .price .v { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
  .price .u { font-size: 13px; color: #64748b; font-weight: 600; }
  .price .g { font-size: 12px; color: #64748b; }
  .grades { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: #64748b; }
  .grades b { color: #334155; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .grades b { color: #cbd5e1; } }
  .outlook { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; }
  .falling { background: #fef3c7; color: #92400e; }
  .rising { background: #fee2e2; color: #991b1b; }
  .steady { background: #dcfce7; color: #166534; }
  @media (prefers-color-scheme: dark) {
    .falling { background: #451a03; color: #fcd34d; }
    .rising { background: #450a0a; color: #fca5a5; }
    .steady { background: #052e16; color: #86efac; }
  }
  .foot { margin-top: 11px; font-size: 11px; color: #64748b; }
  .foot a { color: #059669; text-decoration: none; font-weight: 600; }
  .foot a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div id="app">Loading prices…</div>
<script>
(function () {
  var app = document.getElementById('app');
  var wanted = (new URLSearchParams(location.search).get('city') || 'Toronto').toLowerCase();
  function fmt(currency, v) { return currency === 'CAD' ? (v * 100).toFixed(1) : v.toFixed(3); }
  fetch('data.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var city = data.cities.find(function (c) { return c.name.toLowerCase() === wanted; }) || data.cities[0];
      var arrow = city.outlook.direction === 'Falling' ? '▼' : city.outlook.direction === 'Rising' ? '▲' : '●';
      var pct = (city.outlook.predictedChangePct > 0 ? '+' : '') + city.outlook.predictedChangePct.toFixed(1) + '%';
      app.innerHTML =
        '<div class="head"><span class="city">' + city.label + '</span>' +
        '<span class="week">Week ending ' + city.weekEnding + '</span></div>' +
        '<div class="price"><span class="v">' + city.regularDisplay + '</span>' +
        '<span class="u">' + city.regularUnitLabel + '</span><span class="g">Regular</span></div>' +
        '<div class="grades"><span>Midgrade <b>' + fmt(city.currency, city.prices.Midgrade) + '</b></span>' +
        '<span>Premium <b>' + fmt(city.currency, city.prices.Premium) + '</b></span>' +
        '<span>Diesel <b>' + fmt(city.currency, city.prices.Diesel) + '</b></span></div>' +
        '<div><span class="outlook ' + city.outlook.direction.toLowerCase() + '">Gas Weather: ' + arrow + ' ' +
        city.outlook.direction + ' ' + pct + ' next week</span></div>' +
        '<div class="foot">Weekly data: ' + city.source + ' · Powered by ' +
        '<a href="' + data.siteUrl + '" target="_top">FuelFlux</a> — free widget, embed it on your site</div>';
    })
    .catch(function () { app.textContent = 'FuelFlux prices are unavailable right now.'; });
})();
</script>
</body>
</html>
